# R CMD check of TriGer on Linux, macOS and Windows with the current R
# release, and R CMD check plus BiocCheck in the Bioconductor devel container.
# BiocCheck skips the support-site check, which depends on the maintainer's
# profile; run it locally before submission.
name: R-CMD-check

on:
  push:
    branches: [main, devel]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} (R release)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: false

  bioc-devel:
    name: Bioconductor devel (BiocCheck)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: bioconductor/bioconductor_docker:devel
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          BiocManager::install(c("BiocCheck", "remotes"), update = FALSE,
              ask = FALSE)
          remotes::install_deps(dependencies = TRUE, upgrade = "never",
              repos = BiocManager::repositories())
        shell: Rscript {0}

      - name: R CMD build
        run: R CMD build .

      - name: R CMD check
        run: |
          R CMD check --no-manual TriGer_*.tar.gz
          if grep -q -E "^Status:.*(WARNING|ERROR)" TriGer.Rcheck/00check.log
          then
            exit 1
          fi

      - name: BiocCheck
        run: |
          tarball <- Sys.glob("TriGer_*.tar.gz")
          BiocCheck::BiocCheck(tarball, `new-package` = TRUE,
              `no-check-bioc-help` = TRUE, `quit-with-status` = TRUE)
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bioc-devel-results
          path: |
            TriGer.Rcheck/
            TriGer.BiocCheck/
